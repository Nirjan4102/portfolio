services:
  - type: web
    name: portfolio
    runtime: node
    repo: https://github.com/Nirjan4102/portfolio
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RECEIVER_EMAIL
        sync: false
      - key: GITHUB_USERNAME
        value: Nirjan4102
